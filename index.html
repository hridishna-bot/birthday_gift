<!DOCTYPE html>
<html>
<head>
<title>Birthday ❤️</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: black;
  color: white; 
}

.hidden {
  display: none;
}

img {
  width: 200px;
  margin: 10px;
  border-radius: 10px;
}

button {
  padding: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- PIN -->
<div id="pinPage">
  <h2>Enter PIN 🔐</h2>
  <input id="pinInput" type="password">
  <br>
  <button onclick="checkPin()">Unlock</button>
  <p id="error"></p>
</div>

<!-- COUNTDOWN -->
<div id="countPage" class="hidden">
  <h1 id="count">5</h1>
</div>

<!-- MAIN -->
<div id="mainPage" class="hidden">
  <h1>Happy Birthday Arun 🎉</h1>

  <p>You are annoying… but still my favourite person ❤️</p>

  <img src="photo1.png">
  <img src="photo2.png">
  <img src="photo3.png">

  <p style="margin-top:20px;">
    One day the only thing between us will be a smile, not a screen ❤️
  </p>
</div>

<script>

// PIN CHECK
function checkPin() {
  let pin = document.getElementById("pinInput").value.trim();

  if (pin === "bubu") {
    document.getElementById("pinPage").style.display = "none";
    document.getElementById("countPage").style.display = "block";
    startCountdown();
  } else {
    document.getElementById("error").innerText = "Wrong PIN 😒";
  }
}

// COUNTDOWN
function startCountdown() {
  let num = 5;
  let el = document.getElementById("count");

  let timer = setInterval(() => {
    num--;
    el.innerText = num;

    if (num === 0) {
      clearInterval(timer);
      document.getElementById("countPage").style.display = "none";
      document.getElementById("mainPage").style.display = "block";
    }
  }, 1000);
}

</script>

</body>
</html>
